name: Tower of Hanoi

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  move:
    if: startsWith(github.event.issue.title, '[Hanoi]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: profile-hanoi
      queue: max

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Play turn
        id: turn
        run: |
          reply=$(python3 hanoi/game.py)
          if ! git diff --quiet -- README.md hanoi/state.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md hanoi/state.json hanoi/boards
            git commit -m "Play Hanoi turn (#${ISSUE_NUMBER})"
            git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"
          fi
          printf 'reply=%s\n' "$reply" >> "$GITHUB_OUTPUT"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Close move issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPLY: ${{ steps.turn.outputs.reply }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$REPLY"
